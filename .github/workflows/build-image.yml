name: Publish SCS Varnish Image

on:
  push:
    branches: [1.x]
    tags:
      - "*.*.*"

env:
  REGISTRY: ghcr.io
  # GHCR package name (wisski-base-stack compose); repo is scs-varnish-image.
  IMAGE_NAME: soda-collections-objects-data-literacy/scs-varnish
  PLATFORMS: linux/amd64
  CONTEXT_DIRECTORY: .

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine if latest release tag
        id: release
        run: |
          is_latest=false
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            current="${GITHUB_REF#refs/tags/}"
            latest=$(git tag -l '*.*.*' --sort=-v:refname | head -1)
            if [[ -n "$latest" && "$current" == "$latest" ]]; then
              is_latest=true
            fi
          fi
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.is_latest == 'true' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_DIRECTORY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
          pull: true
          push: true
